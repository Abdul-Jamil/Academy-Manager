services:
  mysqldb:
    image: mysql:latest
    container_name: test-academy-database
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test123
      MYSQL_DATABASE: school-test
    volumes:
      - test-academy-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest123" ]
      timeout: 5s
      retries: 10
      interval: 3s

  app:
    build: .
    container_name: test-academy-app
    ports:
      - "8080:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      - DB_HOST=mysqldb
      - DB_PORT=3306
      - DB_NAME=school-test
      - DB_USER=root
      - DB_PASS=test123

volumes:
  test-academy-data:
